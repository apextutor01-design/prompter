<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prompter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Prompter"><meta name="theme-color" content="#000000"><link id="icon" rel="apple-touch-icon" href=""><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--surface:#fff;--ink:#14181f;--mute:#5b6572;--line:#d9dde3;--rec:#e5322d;--on-rec:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--surface:#181e26;--ink:#eef0f3;--mute:#98a2b0;--line:#2a323d}}
:root[data-theme="dark"]{--bg:#0f1318;--surface:#181e26;--ink:#eef0f3;--mute:#98a2b0;--line:#2a323d}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--rec);outline-offset:2px}
#edit{height:100%;display:flex;flex-direction:column;padding:16px;gap:12px;max-width:720px;margin:0 auto}
h1{font-size:1.25rem;margin:0;display:flex;align-items:center;gap:8px}
h1 i{width:12px;height:12px;border-radius:50%;background:var(--rec);display:inline-block}
#script{flex:1;min-height:0;width:100%;resize:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:16px;font:inherit;font-size:1.1rem;line-height:1.6}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--mute);font-size:.9rem}
.row button.link{background:none;border:0;color:var(--mute);text-decoration:underline;padding:8px 0}
.start{background:var(--rec);color:var(--on-rec);border:0;border-radius:999px;padding:16px;font-size:1.15rem;font-weight:700;width:100%}
.start:disabled{opacity:.4}
.opts{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:.95rem}
.opts input[type=range]{width:100%;accent-color:var(--rec)}
.opts label.chk{grid-column:1/-1;display:flex;gap:10px;align-items:center}

#stage{position:fixed;inset:0;background:#000;color:#fff;display:none;z-index:5;overflow:hidden}
#stage.on{display:block}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#cam.front{transform:scaleX(-1)}
#box{position:absolute;left:0;right:0;top:0;height:calc(34% + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);background:linear-gradient(rgba(0,0,0,.72) 82%,rgba(0,0,0,0))}
#view{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:0;overflow-y:scroll;scrollbar-width:none;touch-action:pan-y}
#view::-webkit-scrollbar{display:none}
#text{padding:11vh 20px 40vh;font-weight:700;line-height:1.3;text-align:center;white-space:pre-wrap;word-wrap:break-word;max-width:900px;margin:0 auto;text-shadow:0 1px 3px #000}
#stage.mirror #text{transform:scaleX(-1)}
#line{position:absolute;left:0;top:calc(env(safe-area-inset-top,0px) + 11vh + .4em);width:0;height:0;border:7px solid transparent;border-left:11px solid var(--rec);border-right:0;pointer-events:none}
#msg{position:absolute;left:16px;right:16px;top:40%;text-align:center;color:#ffd7d5;font-size:.95rem;display:none}
#bar{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.85) 35%);display:flex;flex-direction:column;gap:10px}
#stage.rec .opt{display:none}
.ctrl{display:flex;align-items:center;gap:12px;font-size:.9rem}
.ctrl input[type=range]{flex:1;accent-color:var(--rec)}
.main-row{display:flex;align-items:center;justify-content:space-between}
.pill{background:rgba(255,255,255,.16);border:0;border-radius:999px;padding:10px 16px;color:#fff;font-weight:700}
#rec{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:none;padding:6px}
#rec i{display:block;width:100%;height:100%;border-radius:50%;background:var(--rec);transition:all .15s}
#stage.rec #rec i{border-radius:8px;transform:scale(.55)}
#time{min-width:64px;text-align:center;font-weight:700}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:30vmin;font-weight:700;color:#fff;text-shadow:0 2px 12px #000;pointer-events:none}
#count.on{display:flex}
#result{position:absolute;inset:0;background:#000;display:none;flex-direction:column;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#result.on{display:flex}
#result video{flex:1;min-height:0;max-width:100%;border-radius:12px;background:#111}
#result .pill.main{background:var(--rec)}
#result .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.perm{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:.95rem}.perm p{margin:0;color:var(--mute)}.perm button{align-self:flex-start;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 18px;font-weight:700}.perm.bad p{color:var(--rec)}</style>
</head>
<body>
<main id="edit">
  <h1><i></i>Prompter</h1>
  <div class="perm" id="perm"><strong>Allow camera and microphone</strong><p id="permMsg">Prompter needs both to record you while your script scrolls.</p><button id="permBtn">Allow access</button><button id="openBtn" style="display:none">Open in browser</button></div>
  <textarea id="script" aria-label="Your script" placeholder="Paste or type your script here. Line breaks are kept, so use them to mark where you pause."></textarea>
  <div class="row"><span id="meta">0 words</span><button class="link" id="clear">Clear script</button></div>
  <div class="opts">
    <label for="speed">Speed</label><input id="speed" type="range" min="1" max="20" value="6">
    <label for="size">Text size</label><input id="size" type="range" min="20" max="80" value="34">
    <label class="chk"><input id="mirror" type="checkbox"> Mirror text </label>
    <label class="chk"><input id="count3" type="checkbox" checked> 3-second countdown</label>
  </div>
  <button class="start" id="go" disabled>Start prompter</button>
</main>

<section id="stage" aria-label="Prompter">
  <video id="cam" autoplay playsinline muted></video>
  <div id="box"><div id="view"><div id="text"></div></div><div id="line"></div></div>
  <div id="msg"></div>
  <div id="count"></div>
  <div id="bar">
    <div class="ctrl opt"><span>Speed</span><input id="speed2" type="range" min="1" max="20"></div>
    <div class="ctrl opt"><span>Size</span><input id="size2" type="range" min="20" max="80"></div>
    <div class="main-row">
      <button class="pill opt" id="back">Edit script</button>
      <button id="rec" aria-label="Record"><i></i></button>
      <span id="time"></span>
      <button class="pill opt" id="flip">Flip camera</button>
    </div>
  </div>
  <div id="result"><video id="rv" controls playsinline></video>
    <div class="btns"><button class="pill main" id="share">Save video</button><button class="pill" id="again">Record again</button><button class="pill" id="done">Edit script</button></div></div>
</section>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var script=$("script"),speed=$("speed"),size=$("size"),mirror=$("mirror"),count3=$("count3"),go=$("go");
  var stage=$("stage"),view=$("view"),text=$("text"),cam=$("cam"),rec=$("rec"),count=$("count"),msg=$("msg");
  var speed2=$("speed2"),size2=$("size2");
  var running=false,recording=false,pos=0,last=0,raf=0,wake=null,cdTimer=0,stream=null,mr=null,chunks=[],facing="user",t0=0,tt=0,blob=null,mime="";

  try{var c=document.createElement("canvas");c.width=c.height=180;var x=c.getContext("2d");x.fillStyle="#e5322d";x.fillRect(0,0,180,180);x.fillStyle="#fff";x.beginPath();x.arc(90,90,52,0,7);x.fill();x.fillStyle="#e5322d";x.beginPath();x.arc(90,90,34,0,7);x.fill();$("icon").href=c.toDataURL("image/png")}catch(e){}

  function load(){try{var s=JSON.parse(localStorage.getItem("prompter2")||"null");if(s){script.value=s.t||"";speed.value=s.sp||6;size.value=s.sz||34;mirror.checked=!!s.m;count3.checked=s.c!==false}}catch(e){}}
  function save(){try{localStorage.setItem("prompter2",JSON.stringify({t:script.value,sp:+speed.value,sz:+size.value,m:mirror.checked,c:count3.checked}))}catch(e){}}
  function meta(){var w=script.value.trim()?script.value.trim().split(/\s+/).length:0;var m=Math.max(1,Math.round(w/150));$("meta").textContent=w+" words"+(w?", about "+m+" min at a calm pace":"");go.disabled=!w}
  $("edit").addEventListener("input",function(){meta();save()});
  $("edit").addEventListener("change",function(){meta();save()});
  $("clear").onclick=function(){if(!script.value||confirm("Clear the whole script?")){script.value="";meta();save();script.focus()}};

  function applySize(){text.style.fontSize=size2.value+"px"}
  function lock(){try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(w){wake=w}).catch(function(){})}catch(e){}}
  function unlock(){try{if(wake){wake.release();wake=null}}catch(e){}}
  document.addEventListener("visibilitychange",function(){if(stage.classList.contains("on")&&document.visibilityState==="visible")lock()});

  function setRun(r){running=r;cancelAnimationFrame(raf);if(r){pos=view.scrollTop;last=performance.now();raf=requestAnimationFrame(tick)}}
  function tick(t){var dt=Math.min(.1,(t-last)/1000);last=t;pos+=+speed2.value*10*dt;view.scrollTop=pos;if(view.scrollTop<pos-2){setRun(false);return}raf=requestAnimationFrame(tick)}

  function startCam(){
    stopCam();msg.style.display="none";
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){noCam("This browser can’t open the camera. The prompter still scrolls.");return Promise.resolve()}
    return navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1080},height:{ideal:1920}},audio:true}).then(function(s){
      stream=s;cam.srcObject=s;cam.classList.toggle("front",facing==="user");cam.style.display="block"
    }).catch(function(e){noCam(why(e));permFail(e)})
  }
  function noCam(m){cam.style.display="none";msg.textContent=m;msg.style.display="block"}
  function stopCam(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}cam.srcObject=null}

  function pickMime(){var l=["video/mp4","video/webm;codecs=vp9,opus","video/webm"];for(var i=0;i<l.length;i++){try{if(MediaRecorder.isTypeSupported(l[i]))return l[i]}catch(e){}}return""}
  function startRec(){
    if(stream&&window.MediaRecorder){
      chunks=[];mime=pickMime();
      try{mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream)}catch(e){mr=null}
      if(mr){mr.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};mr.onstop=showResult;mr.start()}
    }
    recording=true;stage.classList.add("rec");t0=Date.now();tt=setInterval(function(){var s=Math.floor((Date.now()-t0)/1000);$("time").textContent=Math.floor(s/60)+":"+("0"+s%60).slice(-2)},500);$("time").textContent="0:00";
    setRun(true)
  }
  function stopRec(){recording=false;stage.classList.remove("rec");clearInterval(tt);$("time").textContent="";setRun(false);if(mr&&mr.state!=="inactive")mr.stop()}
  function showResult(){
    blob=new Blob(chunks,{type:mr.mimeType||mime||"video/webm"});
    $("rv").src=URL.createObjectURL(blob);$("result").classList.add("on")
  }
  function startCountdown(){
    if(!count3.checked){startRec();return}
    var n=3;count.textContent=n;count.classList.add("on");
    cdTimer=setInterval(function(){n--;if(n>0)count.textContent=n;else{clearInterval(cdTimer);count.classList.remove("on");startRec()}},1000)
  }
  function cancelCountdown(){clearInterval(cdTimer);count.classList.remove("on")}

  rec.onclick=function(){
    if(count.classList.contains("on")){cancelCountdown();return}
    if(recording)stopRec();else startCountdown()
  };
  $("box").addEventListener("click",function(){if(recording||!stream)return;setRun(!running)});
  view.addEventListener("scroll",function(){if(!running)pos=view.scrollTop});
  $("flip").onclick=function(){facing=facing==="user"?"environment":"user";startCam()};

  go.onclick=function(){
    text.textContent=script.value;speed2.value=speed.value;size2.value=size.value;applySize();
    stage.classList.toggle("mirror",mirror.checked);stage.classList.add("on");view.scrollTop=0;pos=0;lock();
    facing="user";startCam()
  };
  function leave(){cancelCountdown();if(recording){stopRec()}setRun(false);stopCam();unlock();$("result").classList.remove("on");stage.classList.remove("on");speed.value=speed2.value;size.value=size2.value;save()}
  $("back").onclick=leave;
  $("done").onclick=function(){mr=null;leave()};
  $("again").onclick=function(){$("result").classList.remove("on");$("rv").removeAttribute("src");view.scrollTop=0;pos=0;chunks=[]};
  $("share").onclick=function(){
    if(!blob)return;var ext=(blob.type.indexOf("mp4")>-1)?"mp4":"webm";var f=new File([blob],"prompter-video."+ext,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){})}
    else{var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=f.name;document.body.appendChild(a);a.click();a.remove()}
  };
  speed2.oninput=function(){};size2.oninput=applySize;
  var perm=$("perm");
  function permOk(){perm.style.display="none"}
  function permBad(){perm.style.display="flex";perm.classList.add("bad");$("permMsg").textContent="Access was blocked. Open your browser’s site settings, allow Camera and Microphone for this page, then tap Allow access again."}
  $("permBtn").onclick=function(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$("permMsg").textContent="This browser can’t open the camera.";return}
    navigator.mediaDevices.getUserMedia({video:true,audio:true}).then(function(s){s.getTracks().forEach(function(t){t.stop()});permOk()}).catch(permFail)
  };
  try{if(navigator.permissions&&navigator.permissions.query){Promise.all([navigator.permissions.query({name:"camera"}),navigator.permissions.query({name:"microphone"})]).then(function(r){if(r[0].state==="granted"&&r[1].state==="granted")permOk();else if(r[0].state==="denied"||r[1].state==="denied")permBad()}).catch(function(){})}}catch(e){}
  function why(e){var n=(e&&e.name)||"";var emb=false;try{emb=window.self!==window.top}catch(x){emb=true}
    if(emb&&(n==="NotAllowedError"||n==="SecurityError"))return "The camera is blocked while this page is shown inside another app or preview. Tap Open in browser to run it full screen.";
    if(n==="NotAllowedError"||n==="SecurityError")return "Camera access was denied. Allow Camera and Microphone in your browser’s site settings, then try again.";
    if(n==="NotFoundError")return "No camera or microphone was found on this device.";
    if(n==="NotReadableError")return "Another app is using the camera. Close it and try again.";
    return "Couldn’t open the camera ("+(n||"unknown error")+")."}
  function permFail(e){perm.style.display="flex";perm.classList.add("bad");$("permMsg").textContent=why(e);var emb=false;try{emb=window.self!==window.top}catch(x){emb=true}$("openBtn").style.display=emb?"inline-block":"none"}
  $("openBtn").onclick=function(){window.open(location.href,"_blank")};
  load();meta();
})();
</script>
</body>
</html>
